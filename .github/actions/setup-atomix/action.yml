name: Set up atomiX core toolchain
description: >-
  Installs the "core: simulation and target software" dependency tier from
  docs/dependencies.md, and puts ccache in front of the C++ compiler so that
  Verilator's generated sources are not recompiled from scratch on every run.

inputs:
  cache-key:
    description: >-
      Separates one job's compiler cache from another's. Jobs that build
      different Verilator models should pass different values, so a large
      job cannot evict a small job's entries.
    required: true

runs:
  using: composite
  steps:
    - name: Install the core dependency tier
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential ccache gcc-riscv64-unknown-elf make \
          picolibc-riscv64-unknown-elf python3 git autoconf flex bison \
          help2man libfl-dev zlib1g-dev liblz4-dev

    - name: Read the pinned Verilator installation
      id: verilator
      shell: bash
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        from tools.requirements import satisfies
        tool = json.load(open('tools/requirements.json'))['tools']['verilator']
        pin = tool['ci']
        assert satisfies(pin['version'], tool['supported'])
        for key in ('version', 'revision', 'repository'):
            print(f'{key}={pin[key]}')
        PY

    - name: Restore the pinned Verilator
      id: verilator-cache
      uses: actions/cache@v4
      with:
        path: ~/.local/atomix-verilator
        key: verilator-${{ runner.os }}-${{ runner.arch }}-ubuntu-22.04-${{ steps.verilator.outputs.revision }}-v1

    - name: Build the pinned Verilator on cache miss
      if: steps.verilator-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ATOMIX_VERILATOR_VERSION: ${{ steps.verilator.outputs.version }}
        ATOMIX_VERILATOR_REVISION: ${{ steps.verilator.outputs.revision }}
        ATOMIX_VERILATOR_REPOSITORY: ${{ steps.verilator.outputs.repository }}
      run: |
        unset VERILATOR_ROOT
        git clone --depth 1 --branch "v$ATOMIX_VERILATOR_VERSION" \
          "$ATOMIX_VERILATOR_REPOSITORY" "$RUNNER_TEMP/atomix-verilator-source"
        cd "$RUNNER_TEMP/atomix-verilator-source"
        test "$(git rev-parse HEAD)" = "$ATOMIX_VERILATOR_REVISION"
        autoconf
        ./configure --prefix="$HOME/.local/atomix-verilator"
        make -j2
        make install

    - name: Select and verify the pinned Verilator
      shell: bash
      env:
        ATOMIX_VERILATOR_VERSION: ${{ steps.verilator.outputs.version }}
      run: |
        unset VERILATOR_ROOT
        "$HOME/.local/atomix-verilator/bin/verilator" --version
        python3 - <<'PY'
        import os, re, subprocess
        from pathlib import Path
        executable = Path.home() / '.local/atomix-verilator/bin/verilator'
        result = subprocess.check_output([str(executable), '--version'], text=True)
        assert re.search(r'Verilator\s+(\S+)', result).group(1) == os.environ['ATOMIX_VERILATOR_VERSION']
        PY
        echo "$HOME/.local/atomix-verilator/bin" >> "$GITHUB_PATH"

    # Ubuntu's ccache package ships compiler symlinks in /usr/lib/ccache.
    # Putting that directory first transparently caches every C++ compile,
    # including the ones Verilator drives through its own generated Makefile.
    - name: Put ccache ahead of the compiler
      shell: bash
      run: |
        echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"

    - name: Restore the compiler cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ inputs.cache-key }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ inputs.cache-key }}-

    # `make doctor` is the same report a developer runs locally, so a CI log
    # and a bug report describe the host in identical terms -- including which
    # ISA spelling mk/toolchain.mk probed for this compiler, which is the
    # detail most likely to differ between a runner and a contributor's box.
    - name: Record the toolchain this run used
      shell: bash
      run: make doctor
